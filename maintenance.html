<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" type="image/jpeg" href="bilder/weblogo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormulaX - Under Maintenance</title>
<style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .maintenance-card { 
            background: #1e293b; 
            color: #f8fafc; 
            border-radius: 16px; 
            padding: 40px 30px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); 
            border: 1px solid #334155; 
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        .maintenance-card h1 { 
            color: #fff; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 16px; 
            margin-bottom: 20px; 
            font-size: 2rem;
            font-weight: 700;
        }

        .maintenance-card p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* === COUNTDOWN STYLES === */
        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .countdown-box {
            background: #0f172a; /* Nutzt das tiefe Dunkelblau deiner Struktur */
            border: 1px solid #334155;
            padding: 14px 10px;
            border-radius: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .countdown-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3b82f6; /* Dein primäres Blau als Akzent für die Zahlen */
            display: block;
            margin-bottom: 2px;
        }

        .countdown-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <h1>Under Scheduled Maintenance</h1>
        <p>Wir aktualisieren gerade die Plattform. Ein genauer Zeitraum ist nicht bekannt.</p>


        <!--
        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Tage</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Std</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Min</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Sek</span>
            </div>
        </div>
    </div>
        -->

    <script>
        // Ziel-Datum: 7. September 2026 um 00:00:00 Uhr
        const targetDate = new Date("September 7, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Berechnungen für Tage, Stunden, Minuten und Sekunden
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Führende Nullen hinzufügen, falls einstelliger Wert
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // Wenn der Countdown abgelaufen ist
            if (difference < 0) {
                clearInterval(countdownInterval);
                document.querySelector(".countdown-container").innerHTML = "<p style='grid-column: span 4; color: #10b981; font-weight: 600;'>Wartung beendet. Die Seite geht gleich online!</p>";
            }
        }, 1000);
    </script>

</body>
</html>
